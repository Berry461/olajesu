<svg width="520" height="160" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .word { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Main wordmark -->
  <text x="260" y="78" text-anchor="middle" class="word"
        font-size="56" font-weight="400" fill="#6B1E2B" letter-spacing="1">
    OlaJesu
  </text>

  <!-- Divider: line - diamond - line -->
  <g transform="translate(260, 100)">
    <line x1="-70" y1="0" x2="-18" y2="0" stroke="#C6A253" stroke-width="2"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#C6A253" transform="rotate(45 0 0)"/>
    <line x1="18" y1="0" x2="70" y2="0" stroke="#C6A253" stroke-width="2"/>
  </g>

  <!-- '26 -->
  <text x="260" y="138" text-anchor="middle" class="word"
        font-size="30" font-style="italic" fill="#C6A253" letter-spacing="2">
    &#8217;26
  </text>
</svg>